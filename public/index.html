<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kabreet Padel Courts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Login Overlay -->
  <div class="login-overlay" id="loginOverlay" style="display:none;">
    <div class="login-panel">
      <div class="login-logo">
        <span class="login-logo-icon">🎾</span>
        <h1>Kabreet Padel</h1>
        <p>Family Retreat Court Booking</p>
      </div>
      <div class="login-form">
        <h2>Who are you?</h2>
        <p class="login-hint">Select your name to get started</p>
        <div class="login-search-wrap">
          <input type="text" id="loginPlayerSearch" placeholder="Search your name..." autocomplete="off" />
        </div>
        <div class="login-player-list" id="loginPlayerList"></div>
        <p class="login-not-registered">Not in the list? Ask the admin to add you.</p>
      </div>
    </div>
  </div>

  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🎾</span>
        <div>
          <h1>Kabreet Padel</h1>
          <p class="subtitle">Family Retreat Court Booking</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-player" id="headerPlayerChip" title="Switch player" style="display:none;">
          <i data-lucide="user" class="icon"></i>
          <span id="headerPlayerName"></span>
        </button>
        <button class="header-btn" id="leaderboardBtn" title="Leaderboard">
          <i data-lucide="trophy" class="icon"></i>
        </button>
        <a href="/admin.html" class="header-btn" title="Admin Panel">
          <i data-lucide="settings" class="icon"></i>
        </a>
        <div class="live-badge">
          <span class="live-dot"></span>
          Live
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Info bar: clock -->
    <section class="info-bar" id="infoBar">
      <div class="info-clock">
        <span class="info-icon"><i data-lucide="clock" class="icon-lg"></i></span>
        <div>
          <span id="currentTime" class="clock-time">--:--</span>
          <span id="currentDateInfo" class="clock-date">---</span>
        </div>
      </div>
    </section>

    <!-- Date selector -->
    <section class="date-section">
      <div class="date-nav">
        <button class="btn-nav" id="prevDay" aria-label="Previous day">
          <i data-lucide="chevron-left" class="icon"></i>
        </button>
        <div class="date-display">
          <span id="dateLabel" class="date-label"></span>
          <span id="dateSubLabel" class="date-sublabel"></span>
        </div>
        <button class="btn-nav" id="nextDay" aria-label="Next day">
          <i data-lucide="chevron-right" class="icon"></i>
        </button>
      </div>
    </section>

    <!-- Courts grid -->
    <section class="courts-section" id="courtsSection">
      <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner" aria-label="Loading" aria-busy="true"></div>
        <p>Loading schedule...</p>
      </div>
      <div class="courts-grid" id="courtsGrid" style="display:none;"></div>
    </section>

    <!-- Legend -->
    <section class="legend">
      <div class="legend-item">
        <div class="legend-dot available"></div>
        <span>Available</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot booked"></div>
        <span>Booked</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot locked"></div>
        <span>Locked</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot past"></div>
        <span>Past</span>
      </div>
    </section>
  </main>

  <!-- Booking Modal -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Booking">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">
        <i data-lucide="x" class="icon"></i>
      </button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- Leaderboard overlay -->
  <div class="modal-overlay" id="leaderboardOverlay" role="dialog" aria-modal="true" aria-label="Leaderboard">
    <div class="modal leaderboard-modal">
      <button class="modal-close" id="leaderboardClose" aria-label="Close">
        <i data-lucide="x" class="icon"></i>
      </button>
      <div class="modal-content" id="leaderboardContent">
        <h3><i data-lucide="trophy" class="icon"></i> Leaderboard</h3>
        <p class="modal-subtitle">Player rankings by wins</p>
        <div id="leaderboardTable"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
