<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kabreet Padel Courts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🎾</span>
        <div>
          <h1>Kabreet Padel</h1>
          <p class="subtitle">Family Retreat Court Booking</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="leaderboardBtn" title="Leaderboard">🏆</button>
        <div class="live-badge">
          <span class="live-dot"></span>
          Live
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Info bar: clock + weather -->
    <section class="info-bar" id="infoBar">
      <div class="info-clock">
        <span class="info-icon">🕐</span>
        <div>
          <span id="currentTime" class="clock-time">--:--</span>
          <span id="currentDateInfo" class="clock-date">---</span>
        </div>
      </div>
      <div class="info-weather" id="weatherWidget">
        <span class="info-icon" id="weatherIcon">🌤</span>
        <div>
          <span id="weatherTemp" class="weather-temp">--</span>
          <span id="weatherCondition" class="weather-cond">Loading...</span>
        </div>
      </div>
    </section>

    <!-- Date selector -->
    <section class="date-section">
      <div class="date-nav">
        <button class="btn-nav" id="prevDay" aria-label="Previous day">&#8592;</button>
        <div class="date-display">
          <span id="dateLabel" class="date-label"></span>
          <span id="dateSubLabel" class="date-sublabel"></span>
        </div>
        <button class="btn-nav" id="nextDay" aria-label="Next day">&#8594;</button>
      </div>
    </section>

    <!-- Player selector -->
    <section class="name-section">
      <div class="name-box">
        <label for="playerSelect">Select Player</label>
        <div class="player-select-row">
          <div class="player-input-wrap">
            <input
              type="text"
              id="playerSearch"
              placeholder="Search or type your name..."
              maxlength="40"
              autocomplete="off"
            />
            <div class="player-dropdown" id="playerDropdown"></div>
          </div>
        </div>
        <input type="hidden" id="selectedPlayerId" />
        <div class="selected-player" id="selectedPlayerDisplay" style="display:none;">
          <span id="selectedPlayerName"></span>
          <button class="btn-clear-player" id="clearPlayerBtn">&times;</button>
        </div>
      </div>
    </section>

    <!-- Courts grid -->
    <section class="courts-section" id="courtsSection">
      <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
        <p>Loading schedule...</p>
      </div>
      <div class="courts-grid" id="courtsGrid" style="display:none;"></div>
    </section>

    <!-- Legend -->
    <section class="legend">
      <div class="legend-item">
        <div class="legend-dot available"></div>
        <span>Available</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot booked"></div>
        <span>Booked</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot locked"></div>
        <span>Locked</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot past"></div>
        <span>Past</span>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <!-- Leaderboard overlay -->
  <div class="modal-overlay" id="leaderboardOverlay">
    <div class="modal leaderboard-modal">
      <button class="modal-close" id="leaderboardClose">&times;</button>
      <div class="modal-content" id="leaderboardContent">
        <h3>🏆 Leaderboard</h3>
        <p class="modal-subtitle">Player rankings by wins</p>
        <div id="leaderboardTable"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
